name: Build VaporKey

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Build (Windows VST3)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: cmd
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --target VaporKey_VST3 --parallel

      - name: Locate VST3
        id: locate
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Recurse -Path build -Filter "VaporKey.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "VST3 not found" }
          echo "Found: $($vst3.FullName)"
          echo "VST3_PATH=$($vst3.FullName)" >> $env:GITHUB_ENV

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-Windows-VST3
          path: ${{ env.VST3_PATH }}

      - name: Upload Standalone (optional)
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-Windows-Standalone
          path: build/VaporKey_artefacts/Release/Standalone/*.exe
          if-no-files-found: ignore

  macos:
    name: Build (macOS VST3 + AU)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build --config Release --target VaporKey_VST3 --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-macOS-VST3
          path: build/VaporKey_artefacts/Release/VST3/VaporKey.vst3

  linux:
    name: Build (Linux VST3)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libgtk-3-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target VaporKey_VST3 --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-Linux-VST3
          path: build/VaporKey_artefacts/Release/VST3/VaporKey.vst3
