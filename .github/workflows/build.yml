name: Build VaporKey

# A push to a feature branch with an open PR used to fire this workflow
# twice (once for `push`, once for `pull_request`). The push trigger is
# now scoped to `main` and tags - PRs cover every other branch we care
# about, so each commit produces a single run instead of two.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

# If a newer commit lands on the same ref, abandon the in-flight run and
# start fresh. Stops a flurry of pushes from queueing up duplicate jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pluginval pinned to a specific tag so a pluginval upstream regression can't
# silently break every build - bump intentionally after verifying locally.
# Asset URL is /releases/download/<tag>/<asset> (the /releases/<tag>/download/
# alias only works for the literal string "latest").
env:
  PLUGINVAL_VERSION: v1.0.4
  PLUGINVAL_STRICTNESS: "5"

jobs:
  preset-lint:
    name: Lint factory presets
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libgtk-3-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DVAPORKEY_LTO=OFF

      - name: Build lint tool
        run: cmake --build build --target VaporKeyPresetLint --parallel

      - name: Run preset lint
        run: |
          set -euo pipefail
          BIN=$(find build -type f \( -name VaporKeyPresetLint -o -name 'VaporKeyPresetLint.exe' \) -perm -u+x | head -n1)
          if [ -z "$BIN" ]; then
            echo "VaporKeyPresetLint binary not found under build/" >&2
            exit 1
          fi
          echo "Running $BIN against Source/Presets.json"
          "$BIN" Source/Presets.json

  tests:
    name: Run test suite
    runs-on: ubuntu-22.04
    needs: preset-lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libgtk-3-dev \
            xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DVAPORKEY_LTO=OFF

      - name: Build tests
        run: cmake --build build --target VaporKeyTests --parallel

      - name: Run tests
        # JUCE's GUI initialiser only opens an X display lazily, but the audio
        # processor / message manager paths a few suites use can probe the
        # display when X is missing. Wrap in xvfb-run for safety in CI; on a
        # workstation `VaporKeyTests` runs fine without it.
        run: |
          set -euo pipefail
          BIN=$(find build -type f -name VaporKeyTests -perm -u+x | head -n1)
          if [ -z "$BIN" ]; then
            echo "VaporKeyTests binary not found under build/" >&2
            exit 1
          fi
          echo "Running $BIN"
          xvfb-run -a "$BIN"

  windows:
    name: Build (Windows VST3)
    runs-on: windows-2022
    needs: tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Windows Defender realtime scanning briefly holds .obj files as cl.exe
      # writes them, which has been one source of intermittent CI flakiness.
      # Excluding the workspace, MSVC toolchain dirs, and the build processes
      # themselves removes that interference without disabling Defender
      # system-wide. Add-MpPreference needs the elevated shell GitHub-hosted
      # runners already provide.
      - name: Exempt build paths from Defender realtime scan
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "C:\Program Files\Microsoft Visual Studio"
          Add-MpPreference -ExclusionPath "C:\Program Files (x86)\Microsoft Visual Studio"
          Add-MpPreference -ExclusionPath "C:\Program Files (x86)\Windows Kits"
          Add-MpPreference -ExclusionProcess "cl.exe"
          Add-MpPreference -ExclusionProcess "link.exe"
          Add-MpPreference -ExclusionProcess "cmake.exe"
          Add-MpPreference -ExclusionProcess "ninja.exe"

      # Set up the MSVC environment (cl.exe in PATH, INCLUDE, LIB, etc.) for
      # all subsequent steps in this job. ilammy/msvc-dev-cmd is the standard
      # GH-Actions wrapper around vcvars64.bat.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Use Ninja instead of the Visual Studio MSBuild generator. PRs #34-#39
      # chased a long string of D8040 / MSB6006 cl.exe crashes that all traced
      # back to MSBuild's CL task: /MP injected by JUCE's
      # juce_recommended_config_flags, batched cl.exe invocations holding
      # cumulative AST state, UseMultiToolTask's separate parallelism layer
      # ignoring --parallel. Ninja sidesteps that entire stack: each .cpp gets
      # its own cl.exe, --parallel directly controls the live cl count, no
      # /MP, no MSBuild pool. windows-2022 ships ninja preinstalled.
      - name: Configure
        shell: cmd
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVAPORKEY_LTO=OFF

      - name: Build
        # VaporKey_All builds both VST3 and Standalone (the artefacts this job
        # uploads). Targeting it explicitly avoids rebuilding VaporKeyTests and
        # VaporKeyPresetLint here - those already ran on Linux. --parallel 2
        # caps live cl.exe at 2 (~4 GB peak on JUCE-template-heavy TUs), well
        # under the runner's 16 GB cap.
        shell: cmd
        run: cmake --build build --target VaporKey_All --parallel 2

      - name: Locate VST3
        id: locate
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Recurse -Path build -Filter "VaporKey.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "VST3 not found" }
          echo "Found: $($vst3.FullName)"
          echo "VST3_PATH=$($vst3.FullName)" >> $env:GITHUB_ENV

      - name: Locate Standalone
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path build -Filter "VaporKey.exe" | Where-Object { $_.FullName -match "Standalone" } | Select-Object -First 1
          if (-not $exe) { throw "Standalone exe not found" }
          echo "Found: $($exe.FullName)"
          echo "STANDALONE_PATH=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Validate with pluginval
        shell: pwsh
        run: |
          $url = "https://github.com/Tracktion/pluginval/releases/download/${env:PLUGINVAL_VERSION}/pluginval_Windows.zip"
          Invoke-WebRequest -Uri $url -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval-bin -Force
          $exe = Get-ChildItem -Recurse -Path pluginval-bin -Filter "pluginval.exe" | Select-Object -First 1
          if (-not $exe) { throw "pluginval.exe not found in archive" }
          & $exe.FullName --strictness-level $env:PLUGINVAL_STRICTNESS --validate-in-process --validate $env:VST3_PATH

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-Windows-VST3
          path: ${{ env.VST3_PATH }}
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-Windows-Standalone
          path: ${{ env.STANDALONE_PATH }}
          if-no-files-found: error

  macos:
    name: Build (macOS VST3)
    runs-on: macos-14
    needs: tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DVAPORKEY_LTO=OFF

      - name: Build
        # VaporKey_All builds both VST3 and Standalone (the artefacts this job
        # uploads). Targeting it explicitly avoids rebuilding VaporKeyTests and
        # VaporKeyPresetLint here - those already ran on Linux.
        run: cmake --build build --config Release --target VaporKey_All --parallel

      - name: Validate with pluginval
        run: |
          set -euo pipefail
          curl -fsSL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval \
            --strictness-level "${PLUGINVAL_STRICTNESS}" \
            --validate-in-process \
            --validate "build/VaporKey_artefacts/Release/VST3/VaporKey.vst3"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-macOS-VST3
          path: build/VaporKey_artefacts/Release/VST3/VaporKey.vst3
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-macOS-Standalone
          path: build/VaporKey_artefacts/Release/Standalone/VaporKey.app
          if-no-files-found: error

  linux:
    name: Build (Linux VST3)
    runs-on: ubuntu-22.04
    needs: tests
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libgtk-3-dev \
            xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DVAPORKEY_LTO=OFF

      - name: Build
        # VaporKey_All builds both VST3 and Standalone (the artefacts this
        # job uploads). Targeting it explicitly avoids re-compiling
        # VaporKeyTests / VaporKeyPresetLint here - those targets each pull
        # in their own copy of JUCE (incl. harfbuzz), and four independent
        # JUCE compiles in parallel will OOM-kill the runner. --parallel 2
        # plus -DVAPORKEY_LTO=OFF (set above) keep peak memory comfortably
        # under the runner's RAM cap; the previous flat `--parallel` plus
        # LTO link of the post-oversampling/plate-reverb plugin was enough
        # to push us over.
        run: cmake --build build --target VaporKey_All --parallel 2

      - name: Validate with pluginval
        # Linux runners have no display; pluginval instantiates the editor, so
        # we wrap it in xvfb-run.
        run: |
          set -euo pipefail
          curl -fsSL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          unzip -q pluginval.zip
          chmod +x ./pluginval
          xvfb-run -a ./pluginval \
            --strictness-level "${PLUGINVAL_STRICTNESS}" \
            --validate-in-process \
            --validate "build/VaporKey_artefacts/Release/VST3/VaporKey.vst3"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-Linux-VST3
          path: build/VaporKey_artefacts/Release/VST3/VaporKey.vst3
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-Linux-Standalone
          path: build/VaporKey_artefacts/Release/Standalone/VaporKey
          if-no-files-found: error

  # On tag push (vX.Y.Z), bundle the per-OS artefacts into one zip per platform
  # and publish a prerelease GitHub release with auto-generated notes (with an
  # optional curated body from .github/release_notes/<tag>.md prepended).
  # While the project is < 1.0 every tag ships as a prerelease — flip
  # `prerelease: false` once we're ready to mark a tag stable.
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package per-platform zips
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p stage out
          for d in artifacts/*/; do
            name="$(basename "$d")"
            case "$name" in
              *Windows*) plat=Windows ;;
              *macOS*)   plat=macOS ;;
              *Linux*)   plat=Linux ;;
              *)         continue ;;
            esac
            mkdir -p "stage/${plat}"
            cp -R "${d}." "stage/${plat}/"
          done
          for plat in Windows macOS Linux; do
            [ -d "stage/${plat}" ] || continue
            (cd stage && zip -qr "../out/VaporKey-${ver}-${plat}.zip" "${plat}")
          done
          ls -la out

      # Tags can ship with hand-written release notes by adding a markdown
      # file at .github/release_notes/<tag>.md; if it doesn't exist we fall
      # back to the auto-generated commit/PR list alone.
      - name: Locate release notes
        id: notes
        run: |
          set -euo pipefail
          file=".github/release_notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "Using curated notes from $file"
            echo "body_path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "No curated notes file at $file — falling back to auto-generated"
            echo "body_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          draft: false
          prerelease: true
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.body_path }}
