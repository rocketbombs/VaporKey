name: Build VaporKey

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

# Pluginval download URL pattern. Pinned by the user (bump as new pluginval
# releases come out). 'latest' tracks the most recent stable release.
env:
  PLUGINVAL_VERSION: latest
  PLUGINVAL_STRICTNESS: "5"

jobs:
  preset-lint:
    name: Lint factory presets
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libgtk-3-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build lint tool
        run: cmake --build build --target VaporKeyPresetLint --parallel

      - name: Run preset lint
        run: |
          set -euo pipefail
          BIN=$(find build -type f \( -name VaporKeyPresetLint -o -name 'VaporKeyPresetLint.exe' \) -perm -u+x | head -n1)
          if [ -z "$BIN" ]; then
            echo "VaporKeyPresetLint binary not found under build/" >&2
            exit 1
          fi
          echo "Running $BIN against Source/Presets.json"
          "$BIN" Source/Presets.json

  tests:
    name: Run test suite
    runs-on: ubuntu-22.04
    needs: preset-lint
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libgtk-3-dev \
            xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build --target VaporKeyTests --parallel

      - name: Run tests
        # JUCE's GUI initialiser only opens an X display lazily, but the audio
        # processor / message manager paths a few suites use can probe the
        # display when X is missing. Wrap in xvfb-run for safety in CI; on a
        # workstation `VaporKeyTests` runs fine without it.
        run: |
          set -euo pipefail
          BIN=$(find build -type f -name VaporKeyTests -perm -u+x | head -n1)
          if [ -z "$BIN" ]; then
            echo "VaporKeyTests binary not found under build/" >&2
            exit 1
          fi
          echo "Running $BIN"
          xvfb-run -a "$BIN"

  windows:
    name: Build (Windows VST3)
    runs-on: windows-2022
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: cmd
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --target VaporKey_VST3 --parallel

      - name: Locate VST3
        id: locate
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Recurse -Path build -Filter "VaporKey.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "VST3 not found" }
          echo "Found: $($vst3.FullName)"
          echo "VST3_PATH=$($vst3.FullName)" >> $env:GITHUB_ENV

      - name: Validate with pluginval
        shell: pwsh
        run: |
          $url = "https://github.com/Tracktion/pluginval/releases/${env:PLUGINVAL_VERSION}/download/pluginval_Windows.zip"
          Invoke-WebRequest -Uri $url -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval-bin -Force
          $exe = Get-ChildItem -Recurse -Path pluginval-bin -Filter "pluginval.exe" | Select-Object -First 1
          if (-not $exe) { throw "pluginval.exe not found in archive" }
          & $exe.FullName --strictness-level $env:PLUGINVAL_STRICTNESS --validate-in-process --validate $env:VST3_PATH

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-Windows-VST3
          path: ${{ env.VST3_PATH }}

      - name: Upload Standalone (optional)
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-Windows-Standalone
          path: build/VaporKey_artefacts/Release/Standalone/*.exe
          if-no-files-found: ignore

  macos:
    name: Build (macOS VST3)
    runs-on: macos-14
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Validate with pluginval
        run: |
          set -euo pipefail
          curl -fsSL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/${PLUGINVAL_VERSION}/download/pluginval_macOS.zip"
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval \
            --strictness-level "${PLUGINVAL_STRICTNESS}" \
            --validate-in-process \
            --validate "build/VaporKey_artefacts/Release/VST3/VaporKey.vst3"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-macOS-VST3
          path: build/VaporKey_artefacts/Release/VST3/VaporKey.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-macOS-Standalone
          path: build/VaporKey_artefacts/Release/Standalone/VaporKey.app
          if-no-files-found: ignore

  linux:
    name: Build (Linux VST3)
    runs-on: ubuntu-22.04
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libgtk-3-dev \
            xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Validate with pluginval
        # Linux runners have no display; pluginval instantiates the editor, so
        # we wrap it in xvfb-run.
        run: |
          set -euo pipefail
          curl -fsSL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/${PLUGINVAL_VERSION}/download/pluginval_Linux.zip"
          unzip -q pluginval.zip
          chmod +x ./pluginval
          xvfb-run -a ./pluginval \
            --strictness-level "${PLUGINVAL_STRICTNESS}" \
            --validate-in-process \
            --validate "build/VaporKey_artefacts/Release/VST3/VaporKey.vst3"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-Linux-VST3
          path: build/VaporKey_artefacts/Release/VST3/VaporKey.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: VaporKey-Linux-Standalone
          path: build/VaporKey_artefacts/Release/Standalone/VaporKey
          if-no-files-found: ignore

  # On tag push (vX.Y.Z), bundle the per-OS artefacts into one zip per platform
  # and create a draft GitHub release so the maintainer can review the auto-
  # generated notes before publishing.
  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package per-platform zips
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p stage out
          for d in artifacts/*/; do
            name="$(basename "$d")"
            case "$name" in
              *Windows*) plat=Windows ;;
              *macOS*)   plat=macOS ;;
              *Linux*)   plat=Linux ;;
              *)         continue ;;
            esac
            mkdir -p "stage/${plat}"
            cp -R "${d}." "stage/${plat}/"
          done
          for plat in Windows macOS Linux; do
            [ -d "stage/${plat}" ] || continue
            (cd stage && zip -qr "../out/VaporKey-${ver}-${plat}.zip" "${plat}")
          done
          ls -la out

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          draft: true
          generate_release_notes: true
